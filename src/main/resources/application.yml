spring:
  application:
    name: ai-test-generation-engine
  threads:
    virtual:
      enabled: true
  cloud:
    aws:
      region:
        # Spring Cloud AWS's SsmClient bean is auto-configured unconditionally whenever the
        # starter is on the classpath, independent of the config-import below — without an
        # explicit region it falls back to the SDK's default provider chain, which only
        # succeeds where AWS CLI config/env vars happen to be present (e.g. a dev machine),
        # and fails hard in a clean environment like CI.
        static: ${AWS_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: 8080

testgen:
  llm:
    provider: anthropic
    api-key: ${llm-api-key:${LLM_API_KEY:}}
    model: ${LLM_MODEL:claude-haiku-4-5-20251001}
    max-tokens: 1500
    max-tokens-per-hour: 50000

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    bucket-name: ${AWS_S3_BUCKET:test-generation-artifacts-dev}

github:
  api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
  webhook:
    secret: ${github-webhook-secret:${GITHUB_WEBHOOK_SECRET:}}
  app:
    id: ${github-app-id:${GITHUB_APP_ID:}}
    private-key: ${github-app-private-key:${GITHUB_APP_PRIVATE_KEY:}}
    installation-id: ${GITHUB_APP_INSTALLATION_ID:}

---
# Only import SSM Parameter Store outside the "test" profile — the config-import
# resolves before application-test.yml's own properties are merged, so a plain
# `enabled: false` override there is too late to stop the (slow, network-bound) attempt.
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:aws-parameterstore:/testgen"
